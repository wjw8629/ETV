name: 自动拉取并精简转换为TXT

on: 
  schedule: 
    # 每天世界标准时间 13:00 自动运行（严格对应北美东部时间早上 09:00）
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  main:
    name: update migu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # 允许推送代码
    steps: 
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: fetch and modify
      run: |
        # 运行你的纯净 Python 脚本
        python filter.py
    - name: CommitAndPush
      run: |
        # 获取仓库名称
        REPO_NAME="${GITHUB_REPOSITORY#*/}"
        git config --global user.email "github@github.com"
        git config --global user.name "Github Actions"
        
        # 【精准修复】这里加上了正确的 ${{ }} 解析语法，确保链接拼装绝对正确
        git clone "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git"
        cd "$REPO_NAME" || exit 1

        # 把外面生成的 cctv_clean.txt 强行移动到克隆出来的子仓库里
        [ -f "../cctv_clean.txt" ] && mv ../cctv_clean.txt ./cctv_clean.txt || true

        # 提交并强行推送
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update: $(date +'%Y-%m-%d %H:%M:%S') UTC"
          git push origin main
        fi
