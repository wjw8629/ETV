name: Update live.txt

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download M3U
        run: |
          curl -L \
            "https://raw.githubusercontent.com/ioptu/migu_video/refs/heads/main/cctv.migu.m3u" \
            -o cctv.m3u

      - name: Convert M3U to live.txt
        run: |
          python3 <<'PY'
          import re

          with open("cctv.m3u", "r", encoding="utf-8") as f:
              lines = [x.strip() for x in f if x.strip()]

          output = []

	  output.append("CCTV,#genre#")

          for i, line in enumerate(lines):
              if line.startswith("#EXTINF:") and i + 1 < len(lines):
                  url = lines[i + 1]

                  if url.startswith(("http://", "https://")):
                      name = line.split(",")[-1].strip()
                      output.append(f"{name},{url}")

          with open("live.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update live.txt"
            git push
          fi